name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  POWERSHELL_TELEMETRY_OPTOUT: "1"

jobs:
  windows:
    name: Checks (Windows x64, ${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, release]
    steps:
      - name: Check out source
        uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Set up pinned nightly Rust for Windows x64
        run: |-
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'This workflow supports Windows x64 runners only.'
          }
          rustup set default-host x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # rustup reads rust-toolchain.toml and installs its components.
          $rustDetails = rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustDetails | Write-Output
          if ($rustDetails -notcontains 'host: x86_64-pc-windows-msvc') {
            throw 'Expected the Windows x64 MSVC Rust host.'
          }
          cargo --version

      - name: Check Rust formatting
        if: matrix.profile == 'dev'
        run: cargo fmt --manifest-path converter/Cargo.toml --all -- --check

      - name: Lint Python with Ruff
        if: matrix.profile == 'dev'
        uses: astral-sh/ruff-action@main

      - name: Check Python formatting
        if: matrix.profile == 'dev'
        run: ruff format --check .

      - name: Lint GLua
        if: matrix.profile == 'dev'
        run: |-
          $glualintDir = Join-Path $env:RUNNER_TEMP 'glualint'
          $archive = "$glualintDir.zip"
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/FPtje/GLuaFixer/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -like 'glualint-*-x86_64-windows.zip' }
          if (@($asset).Count -ne 1) {
            throw "Expected one Windows x64 archive in GLuaFixer release $($release.tag_name)."
          }
          Write-Host "Using GLuaFixer $($release.tag_name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $glualintDir
          & (Join-Path $glualintDir 'glualint.exe') lint addons tests

      - name: Run all enabled Clippy checks
        # Compatible checks are strict; source-scoped exceptions document native math.
        run: cargo clippy --locked --manifest-path converter/Cargo.toml --all-targets --profile ${{ matrix.profile }} --target x86_64-pc-windows-msvc --message-format=short -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path converter/Cargo.toml --all-targets --profile ${{ matrix.profile }} --target x86_64-pc-windows-msvc --message-format=short

      - name: Install crate update checker
        if: matrix.profile == 'dev'
        run: cargo install cargo-outdated --locked

      - name: Report available crate updates
        if: matrix.profile == 'dev'
        working-directory: converter
        run: cargo outdated

  luals:
    uses: CFC-Servers/gmod_luals_workflow/.github/workflows/luals.yml@main
    with:
      style_check: true
