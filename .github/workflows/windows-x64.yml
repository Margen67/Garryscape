name: Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converter:
    name: Rust checks and converter (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned nightly Rust for Windows x64
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'This workflow supports Windows x64 runners only.'
          }
          rustup set default-host x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # rustup reads rust-toolchain.toml and installs its components.
          $rustDetails = rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustDetails | Write-Output
          if ($rustDetails -notcontains 'host: x86_64-pc-windows-msvc') {
            throw 'Expected the Windows x64 MSVC Rust host.'
          }
          cargo --version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path converter/Cargo.toml --all -- --check

      - name: Run all enabled Clippy checks
        # The existing warning baseline is advisory; correctness errors fail CI.
        run: cargo clippy --locked --manifest-path converter/Cargo.toml --all-targets --target x86_64-pc-windows-msvc --message-format=short

      - name: Run Rust tests
        run: cargo test --locked --manifest-path converter/Cargo.toml --all-targets --target x86_64-pc-windows-msvc --message-format=short

      - name: Build release converter
        run: cargo build --locked --release --manifest-path converter/Cargo.toml --target x86_64-pc-windows-msvc --message-format=short

      - name: Upload Windows x64 converter
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garryscape-convert-windows-x64
          path: converter/target/x86_64-pc-windows-msvc/release/garryscape-convert.exe
          if-no-files-found: error
