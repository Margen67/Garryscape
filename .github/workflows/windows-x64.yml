name: Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  POWERSHELL_TELEMETRY_OPTOUT: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  converter:
    name: Build converter (Windows x64, ${{ matrix.profile }})
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, release]
    steps:
      - name: Check out source
        uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Set up pinned nightly Rust for Windows x64
        run: |-
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'This workflow supports Windows x64 runners only.'
          }
          rustup set default-host x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # rustup reads rust-toolchain.toml and installs its components.
          $rustDetails = rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustDetails | Write-Output
          if ($rustDetails -notcontains 'host: x86_64-pc-windows-msvc') {
            throw 'Expected the Windows x64 MSVC Rust host.'
          }
          cargo --version

      - name: Build converter
        run: cargo build --locked --profile ${{ matrix.profile }} --manifest-path converter/Cargo.toml --target x86_64-pc-windows-msvc --message-format=short

      - name: Package Windows x64 converter
        if: matrix.profile == 'release'
        working-directory: converter/target/x86_64-pc-windows-msvc/release
        run: 7z a -mx9 -bb3 garryscape-convert-windows-x64.7z garryscape-convert.exe

      - name: Upload Windows x64 converter archive
        if: matrix.profile == 'release'
        uses: actions/upload-artifact@main
        with:
          path: converter/target/x86_64-pc-windows-msvc/release/garryscape-convert-windows-x64.7z
          archive: false
          if-no-files-found: error
