[package]
name = "garryscape-convert"
version = "0.9.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Offline 2009Scape terrain to glTF and Source DMX converter"
repository = "https://github.com/Margen67/Garryscape"
readme = "../README.md"
keywords = ["runescape", "garrysmod", "converter", "gltf", "source-engine"]
categories = ["command-line-utilities", "game-development", "encoding"]

[dependencies]
anyhow = "1"
bzip2 = "0.5"
flate2 = "1"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[profile.release]
codegen-units = 1
lto = true
strip = true

# rustc has no equivalent of -Wall. Enable every opt-in lint in the pinned
# nightly toolchain, retaining default warning/error levels for the rest.
# Update this list together with rust-toolchain.toml when upgrading Rust.
[lints.rust]
warnings = "warn"
absolute_paths_not_starting_with_crate = "warn"
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
dead_code_pub_in_binary = "warn"
deprecated_in_future = "warn"
deprecated_llvm_intrinsic = "warn"
deprecated_safe_2024 = "warn"
deref_into_dyn_supertrait = "warn"
edition_2024_expr_fragment_specifier = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
ffi_unwind_calls = "warn"
if_let_rescope = "warn"
implicit_provenance_casts = "warn"
impl_trait_overcaptures = "warn"
impl_trait_redundant_captures = "warn"
keyword_idents_2018 = "warn"
keyword_idents_2024 = "warn"
let_underscore_drop = "warn"
linker_info = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
missing_unsafe_on_extern = "warn"
multiple_supertrait_upcastable = "warn"
must_not_suspend = "warn"
non_ascii_idents = "warn"
non_exhaustive_omitted_patterns = "warn"
raw_borrows_via_references = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
resolving_to_items_shadowing_supertrait_items = "warn"
rust_2021_incompatible_closure_captures = "warn"
rust_2021_incompatible_or_patterns = "warn"
rust_2021_prefixes_incompatible_syntax = "warn"
rust_2021_prelude_collisions = "warn"
rust_2024_guarded_string_incompatible_syntax = "warn"
rust_2024_incompatible_pat = "warn"
rust_2024_prelude_collisions = "warn"
shadowing_supertrait_items = "warn"
single_use_lifetimes = "warn"
tail_expr_drop_order = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unmarked_unchecked_type_aliases = "warn"
unnameable_types = "warn"
unqualified_local_imports = "warn"
unreachable_pub = "warn"
unsafe_attr_outside_unsafe = "warn"
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
unstable_features = "warn"
unused_crate_dependencies = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"

# Start with every public Clippy group; compatible checks remain enabled.
# Exceptions below select one rule from conflicting style pairs.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Do not downgrade Clippy's default correctness errors when enabling `all`.
correctness = { level = "deny", priority = 0 }

# `unreachable_pub` is enabled above: it narrows exports of this binary to
# `pub(crate)`. `redundant_pub_crate` would require removing that same scope.
redundant_pub_crate = { level = "allow", priority = 1 }

# Keep idiomatic tail expressions (`needless_return`) and `?` propagation
# (`question_mark`); their restriction counterparts require the opposite style.
implicit_return = { level = "allow", priority = 1 }
question_mark_used = { level = "allow", priority = 1 }
# Keep explicit, underscore-separated numeric suffixes and `pub(crate)`.
# Each has an opposing restriction lint; enable only the readable spelling.
separated_literal_suffix = { level = "allow", priority = 1 }
pub_with_shorthand = { level = "allow", priority = 1 }
# Keep semicolons inside blocks; `semicolon_outside_block` requests the opposite.
semicolon_outside_block = { level = "allow", priority = 1 }
# This project deliberately audits the entire restriction group, then makes
# documented exceptions. This meta-lint would prohibit enabling that group.
blanket_clippy_restriction_lints = { level = "allow", priority = 1 }
# This std CLI does not link alloc directly. `std_instead_of_core` stays enabled
# for types available through core; allocation types use the std facade.
std_instead_of_alloc = { level = "allow", priority = 1 }
# Choose modern foo.rs module files; mod_module_files enforces that convention.
self_named_module_files = { level = "allow", priority = 1 }
# Local allow blocks are the project's documented exception mechanism.
# Requiring `expect` would contradict that policy; reasons remain mandatory.
allow_attributes = { level = "allow", priority = 1 }
# Alphabetizing native opcode tables and conversion stages obscures their
# relationship to RT4. Keep declaration order aligned with the reference code.
arbitrary_source_item_ordering = { level = "allow", priority = 1 }
# Single-use helpers still separate protocol, validation and export concerns.
# This check discourages useful decomposition without identifying a defect.
single_call_fn = { level = "allow", priority = 1 }
# Keep decimal algorithm constants recognizable against the RT4 reference.
# decimal_bitwise_operands still checks that actual masks use hex notation.
decimal_literal_representation = { level = "allow", priority = 1 }
