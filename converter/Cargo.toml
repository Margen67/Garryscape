[package]
name = "garryscape-convert"
version = "0.8.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "Offline 2009Scape terrain to glTF and Source DMX converter"

[dependencies]
anyhow = "1"
bzip2 = "0.5"
flate2 = "1"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
